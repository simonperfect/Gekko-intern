# Use the fixed service names: api, mock_ocr, mock_onboarding, nginx
# (+ mongo if you chose MongoDB). Conditions: README.md Q3.
version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: q3_deploy/Dockerfile
    env_file: .env
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - mock_ocr
      - mock_onboarding
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 3

  mock_ocr:
    build:
      context: ../mock_ocr
    container_name: mock_ocr
    ports:
      - "9100:9100"

  mock_onboarding:
    build:
      context: ../mock_onboarding
    container_name: mock_onboarding
    ports:
      - "9200:9200"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  sqlite_data: