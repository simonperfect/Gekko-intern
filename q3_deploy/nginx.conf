# Minimal starting point — extend it, don't blindly copy it.
# Think about: trailing-slash semantics of proxy_pass, client_max_body_size
# (batch CSVs exceed nginx's 1MB default), proxy_read_timeout.
events {
    worker_connections 1024;
}

http {
    #max 10MB
    client_max_body_size 10M;


    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    upstream api_service {   
        server api:8000;
    }

    upstream ocr_service {
        server mock_ocr:9100;
    }

    server {
        listen 80;

        # /api/* to FastAPI 
        location /api/ {
            proxy_pass http://api_service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        #  /ocr/ to Mock OCR 
        location /ocr/ {
            proxy_pass http://mock_ocr:9100/ocr/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}